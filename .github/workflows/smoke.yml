name: Holdem smoke tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install smoke-test runtime
        run: npm install --no-save --package-lock=false jsdom@26.1.0
      - name: Run game smoke tests
        run: node tests/smoke.mjs
